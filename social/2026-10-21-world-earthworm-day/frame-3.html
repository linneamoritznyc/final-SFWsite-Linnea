<!doctype html><html lang="en"><head><meta charset="utf-8"><title>World Earthworm Day, frame 3</title>
<style>
@font-face { font-family: Montserrat; font-weight: 100 900; src: url("../../fonts/montserrat-latin-variable.woff2") format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-weight: 400; src: url("../../fonts/source-sans-3-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Source Sans 3"; font-weight: 600 700; src: url("../../fonts/source-sans-3-latin-600-normal.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F4F1EA; }
.frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.art { position: absolute; left: 0; display: block; }
.box { position: absolute; }
.box::before { content: ""; position: absolute; inset: 0; transform: translate(14px, 14px); z-index: -1; }
.h { font-family: Montserrat, sans-serif; font-weight: 800; letter-spacing: -.01em; }

</style></head><body><div class="frame">
<img class="art" src="art/frame-3.svg" style="top:0px" width="1080" alt="">
<div class="box f3h" style="left:60px;top:96px;width:960px;padding:44px 52px 50px;background:#156826"><style>.f3h::before{background:#22371F}.opt::before{background:#22371F}</style><p class="h" style="font-size:86px;line-height:1.04;color:#F4F1EA">Which earthworm are you today?</p></div><div class="box opt" style="left:520px;top:450px;width:500px;padding:34px 38px 38px;background:#F4F1EA"><p class="h" style="font-size:62px;line-height:1;color:#4F3433;display:flex;align-items:center;gap:22px;margin-bottom:16px"><span style="display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;background:#156826;color:#F4F1EA">1</span>Epigeic.</p><p class="b" style="font-size:44px;line-height:1.22;color:#333130">Lives in the leaf litter and eats fast.</p></div><div class="box opt" style="left:520px;top:845px;width:500px;padding:34px 38px 38px;background:#F4F1EA"><p class="h" style="font-size:62px;line-height:1;color:#4F3433;display:flex;align-items:center;gap:22px;margin-bottom:16px"><span style="display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;background:#6B4C7A;color:#F4F1EA">2</span>Endogeic.</p><p class="b" style="font-size:44px;line-height:1.22;color:#333130">Stays in the topsoil and eats its way through it.</p></div><div class="box opt" style="left:520px;top:1240px;width:500px;padding:34px 38px 38px;background:#F4F1EA"><p class="h" style="font-size:62px;line-height:1;color:#4F3433;display:flex;align-items:center;gap:22px;margin-bottom:16px"><span style="display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;background:#4F3433;color:#F4F1EA">3</span>Anecic.</p><p class="b" style="font-size:44px;line-height:1.22;color:#333130">Digs deep vertical burrows and comes up at night.</p></div>
</div></body></html>
